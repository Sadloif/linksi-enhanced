plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.linksi.app'
    // Android 16 is the supported platform baseline for both compilation and runtime behaviour.
    // Edge-to-edge and predictive-back compatibility are handled by every activity below.
    compileSdk 36

    defaultConfig {
        applicationId "com.linksi.app"
        minSdk 26
        // targetSdk stays at 36: this fork's baseline, and upstream's 34 arrived with a versionCode
        // older than what is already installed on the test phones.
        targetSdk 36
        // versionCode must always increase relative to anything already installed.
        //
        // 23 was the previous release. This build merges upstream 3.2.0 (five commits), so it takes
        // upstream's 3.2.0 versionName while keeping the "-enhanced" marker that distinguishes this
        // fork. The code moves to 24 because 23 is installed on a physical phone and an equal
        // versionCode cannot update over it.
        versionCode 24
        versionName "3.2.0-enhanced.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "../keystroke.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
        // Optional override of the default debug signing config. AGP normally creates and uses
        // ~/.android/debug.keystore, which is not writable in every environment (sandboxes, CI
        // images with a read-only home). Setting DEBUG_KEYSTORE_PATH points it somewhere writable.
        // When the variable is absent this block is skipped and AGP behaves exactly as before.
        if (System.getenv("DEBUG_KEYSTORE_PATH")) {
            debug {
                storeFile file(System.getenv("DEBUG_KEYSTORE_PATH"))
                storePassword System.getenv("DEBUG_KEYSTORE_PASSWORD") ?: "android"
                keyAlias System.getenv("DEBUG_KEY_ALIAS") ?: "androiddebugkey"
                keyPassword System.getenv("DEBUG_KEY_PASSWORD") ?: "android"
            }
        }
    }

    /**
     * ABI splits (specification section 32: ship a small per-device APK *and* one universal APK).
     *
     * The bundled yt-dlp/FFmpeg payload is by far the largest thing in this app - roughly one
     * Python interpreter plus one FFmpeg per ABI - so a universal APK carries four copies of it and
     * is several times the size of a single-ABI one. Splitting is what makes the normal install
     * small again.
     *
     * `reset()` is required: AGP otherwise merges in its own default ABI list, and the build then
     * also emits splits for ABIs this app does not target. The universal APK is kept so there is
     * always one artifact that installs anywhere (and so `assembleDebug` output is never ambiguous
     * about which device it fits).
     */
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            // You must keep the bundled native payload *extracted* on disk. `youtubedl-android`
            // runs its bundled CPython as a real child process (`/system/bin/sh -c ...`), so the
            // interpreter has to exist as a file with a path. With the AGP default
            // (useLegacyPackaging = false) the loader maps the .so straight out of the APK and
            // exec() cannot see it, which is the documented cause of the "python not found" /
            // EACCES class of init failures. This also sets android:extractNativeLibs="true" in
            // the merged manifest. Cost: the install grows by the extracted .so size, which the
            // youtubedl-android maintainers consider mandatory rather than optional.
            useLegacyPackaging = true
        }
    }

    lint {
        // The app ships English plus partial es/ru/zh translations, and new strings intentionally
        // fall back to English rather than being machine translated. This already failed lint on the
        // untouched baseline (9 pre-existing strings), so the check is downgraded rather than the
        // translations being faked. Every other lint error stays fatal.
        disable += 'MissingTranslation'
        abortOnError = true
        warningsAsErrors = false
        // Lint's own analysis of the test source sets crashes in this toolchain
        // ("Unexpected failure during lint analysis of BubblePolicyTest.kt", FileNotFoundException
        // inside a detector) on both the unit-test and androidTest sets. Production sources are still
        // fully analysed, which is what the release gate cares about.
        checkTestSources = false
        checkDependencies = false
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'com.android.volley:volley:1.2.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Hilt DI
    implementation 'com.google.dagger:hilt-android:2.52'
    ksp 'com.google.dagger:hilt-android-compiler:2.52'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    // Coil for image loading (favicons)
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // DataStore Preferences
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Biometric
    implementation 'androidx.biometric:biometric:1.1.0'

    // Jsoup for link metadata
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Work Manager (bin cleanup, and download work for Linksi Enhanced).
    // 2.11.x fixes the Android 15 dataSync foreground-service timeout ANR present in 2.9.0.
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    ksp 'androidx.hilt:hilt-compiler:1.2.0'

    // Site-specific media extraction and muxed downloads (specification sections 16 and 19).
    //
    // LICENCE CONSEQUENCE, STATED PLAINLY AND NOT SOFTENED: `youtubedl-android` and the FFmpeg it
    // bundles are both GPL-3.0 (the published POM for library:0.17.3 declares
    // <license><name>GPL-3.0 license</name></license>, and the :ffmpeg artifact ships Termux's
    // FFmpeg, built with --enable-gpl --enable-version3 plus libx264/libx265/libxvid). Linking
    // either of them makes this APK a GPL-3.0 combined work as a whole: any *distributed* build
    // containing them must therefore be licensed GPL-3.0 in its entirety, ship the complete
    // corresponding source, carry the appropriate legal notices and honour GPL-3.0 section 6
    // (Installation Information). That re-licenses the rest of this fork, which was MIT. Private,
    // personal, undistributed use is unaffected by any of this - no distribution, no obligation.
    // The project owner accepted that trade-off explicitly in order to have a working downloader.
    //
    // Version pinned to 0.17.3 on purpose, NOT 0.18.x: 0.18.x claims 16 KB page-size support but
    // still ships 4 KB-aligned libraries inside libffmpeg.zip.so (upstream issue #365, open), which
    // aborts the native linker the first time FFmpeg loads on a 16 KB-page device. 0.17.3 is also
    // the version Seal ships. Maven Central only: the JitPack coordinate fails to build for every
    // version >= 0.15.0.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.17.3'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.17.3'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // Test-scope only: the Android platform provides org.json at runtime, but unit tests run
    // against stubbed android.jar where JSONObject throws "not mocked". This dependency is NOT
    // packaged into the APK. It is covered in DEPENDENCY_REVIEW.md.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
