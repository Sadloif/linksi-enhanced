org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# AGP's Unified Test Platform keeps scratch state outside the project directory, which fails in
# restricted environments with "java.io.IOException: The system cannot find the path specified" from
# :app:connectedDebugAndroidTest. The legacy instrumentation runner writes its results under app/build
# instead, and reports the same JUnit XML.
android.experimental.androidTest.useUnifiedTestPlatform=false
